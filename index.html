<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
</head>
<body>
    <h1>To-Do List</h1>
    <div class="todo-container">
        <div class="input-container">
            <input type="text" id="new-task" placeholder="Add a new task">
            <div id="buttons">
                <button id="add-task">Add</button>
                <button id="del-Comptask">Clear Completed</button>
            </div>
        </div>
        <div id="countandfilter">
            <div class="countTextContainer">
                <span class="countText" id="completedCount">Completed 0</span>
                <span class="countText" id="pendingCount">Pending 0</span>
            </div>
            <div class="filterButtonContainer">
                <button id="all" class="filterbutton">All</button>
                <button id="completed" class="filterbutton">Completed</button>
                <button id="pending" class="filterbutton">Pending</button>
            </div>
        </div>
        <div id="searchContainer">
            <input type="text" id="searchBar" placeholder="search task...">
            <button id="searchButton">search</button>
        </div>
        <ul>
            <!-- <li>
                <div class="task-item">
                    Task content
                    <div>
                        <input type="checkbox" class="task-checkbox">
                        <span class="task-text">Sample Task 1</span>
                    </div>

                    <div class="task-actions">
                        <button class="edit-task">Edit</button>
                        <button class="delete-task">Delete</button>
                    </div> 
                </div>
            </li> -->
        </ul>
    </div>
    <div id="toast-message"></div>
</body>
</html>
